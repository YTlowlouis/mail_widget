[project]
name = "mail-widget-daemon"
version = "0.1.0"
description = "Client MCP + boucle Groq qui produit l'état lu par le widget"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11",
    "mcp>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
mail-widget-daemon = "mail_daemon.daemon_main:main"
mail-widget-ctl = "mail_daemon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_daemon"]
