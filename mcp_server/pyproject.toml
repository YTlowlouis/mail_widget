[project]
name = "mail-mcp"
version = "0.1.0"
description = "Serveur MCP stdio pour l'accès mail (IMAP), sans appel LLM"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "imap-tools>=1.15",
    "python-dotenv>=1.0",
]

[project.scripts]
mail-mcp = "mail_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_mcp"]
